name: Checkout CI
on:
  push:
    branches: [main]
    paths:
      - "services/checkout/**"
      - "!services/checkout/README.md" # docs changes do NOT trigger CI
  pull_request:
    paths:
      - "services/checkout/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: npm test --prefix services/checkout
